name: Release

# Push a tag like v0.5.0 (after bumping versionCode/versionName), or run it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUCKLOG_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bucklog-release.jks"
      - name: Build signed APK
        env:
          BUCKLOG_RELEASE_STORE_FILE: ${{ runner.temp }}/bucklog-release.jks
          BUCKLOG_RELEASE_STORE_PASSWORD: ${{ secrets.BUCKLOG_RELEASE_STORE_PASSWORD }}
          BUCKLOG_RELEASE_KEY_ALIAS: bucklog
          BUCKLOG_RELEASE_KEY_PASSWORD: ${{ secrets.BUCKLOG_RELEASE_KEY_PASSWORD }}
          BUCKLOG_PICKER_API_KEY: ${{ secrets.BUCKLOG_PICKER_API_KEY }}
          BUCKLOG_CLOUD_PROJECT_NUMBER: ${{ secrets.BUCKLOG_CLOUD_PROJECT_NUMBER }}
        run: |
          ./gradlew :shared:jvmTest :androidApp:assembleRelease
          # Refuse to publish an unsigned APK (happens when the key secrets are missing).
          test -f androidApp/build/outputs/apk/release/androidApp-release.apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "bucklog-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: bucklog-apk
          path: bucklog-*.apk
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: bucklog-*.apk
          generate_release_notes: true
